name: Probe song voice IDs

# 用 CDN HEAD 探测 techno-sp_ja_JP_{f/m/t}XXX_svss 的 ID（切片并行）。
# 手动触发，18 个并行 job 扫 f600-f999 / m600-m999 / t000-t999，
# 最后 merge job 把全部切片合并为一个 merged_result.json。
on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.prefix }}${{ matrix.start }}-${{ matrix.prefix }}${{ matrix.end }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { prefix: f, start: '600', end: '699' }
          - { prefix: f, start: '700', end: '799' }
          - { prefix: f, start: '800', end: '899' }
          - { prefix: f, start: '900', end: '999' }
          - { prefix: m, start: '600', end: '699' }
          - { prefix: m, start: '700', end: '799' }
          - { prefix: m, start: '800', end: '899' }
          - { prefix: m, start: '900', end: '999' }
          - { prefix: t, start: '000', end: '099' }
          - { prefix: t, start: '100', end: '199' }
          - { prefix: t, start: '200', end: '299' }
          - { prefix: t, start: '300', end: '399' }
          - { prefix: t, start: '400', end: '499' }
          - { prefix: t, start: '500', end: '599' }
          - { prefix: t, start: '600', end: '699' }
          - { prefix: t, start: '700', end: '799' }
          - { prefix: t, start: '800', end: '899' }
          - { prefix: t, start: '900', end: '999' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Probe slice
        run: python probe_svss.py ${{ matrix.prefix }} ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.prefix }}${{ matrix.start }}-${{ matrix.prefix }}${{ matrix.end }}
          path: probe_result_*.json

  merge:
    name: Merge all slices
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all slice results
        uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          merge-multiple: true
          path: merged

      - name: Merge into one JSON
        run: python merge_probe.py merged

      - name: Upload merged result
        uses: actions/upload-artifact@v4
        with:
          name: merged-result
          path: merged_result.json
